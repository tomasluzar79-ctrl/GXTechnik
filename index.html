e-height:1.1;margin-bottom:16px}.tile strong{color:var(--blue);font-size:18px}.tile span:last-child{font-size:12px;color:var(--muted)}h2{font-size:21px;margin:27px 0 14px}.record{display:block;width:100%;background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px 19px;text-align:left;margin:10px 0;color:var(--ink)}.record strong{font-size:17px}.meta{color:var(--muted);font-size:13px;margin-top:5px}.excerpt{margin-top:8px;color:#465e73;font-size:14px}.empty{background:#fff;border:1px dashed #becfdf;border-radius:13px;padding:28px;text-align:center;color:var(--muted)}.back{background:none;border:0;color:var(--blue);padding:0;margin-bottom:18px;font-weight:650}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:24px}.content{white-space:pre-wrap;overflow-wrap:anywhere}.attachments{display:grid;gap:9px;margin-top:12px}.attachment{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:9px;color:var(--blue);text-decoration:none;overflow-wrap:anywhere}.badge{font-size:12px;font-weight:700;color:var(--blue);background:var(--light);padding:5px 9px;border-radius:20px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spacer{flex:1}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:14px;font-weight:650}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #b9cad9;border-radius:9px;background:#fff}.field textarea{min-height:160px;resize:vertical}.notice{background:#fff7e8;border:1px solid #f0d5a1;color:#68480e;border-radius:11px;padding:13px 16px;margin-bottom:16px;font-size:14px}.status{font-size:13px;color:var(--muted)}.hide{display:none!important}footer{border-top:1px solid var(--line);padding:18px 0;color:var(--muted);font-size:12px}@media(max-width:740px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bar{min-height:66px}.brandname{font-size:19px}.brandmark{width:44px;height:44px;font-size:22px}.hero{padding:19px}.tile{min-height:150px;padding:15px}.panel{padding:17px}.btn{padding:9px 11px}}

/* Firemní logo a úvodní animace */
.brandmark,.brandname{display:none!important}
.brand-logo{display:block;width:169px;max-width:45vw;height:auto;object-fit:contain}
.brand-caption{font-size:12px;color:var(--muted);font-weight:700;margin-left:4px;white-space:nowrap}
.splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#fff;opacity:1;visibility:visible;transition:opacity .55s ease,visibility .55s ease}
.splash.done{opacity:0;visibility:hidden;pointer-events:none}
.splash-inner{display:flex;flex-direction:column;align-items:center;gap:0;padding:22px;text-align:center;color:#094889}
.splash-orbit{width:min(82vw,340px);height:180px;border:0;box-shadow:none;display:grid;place-items:center;perspective:none;position:relative}
.splash-orbit::after{content:none}
.splash-logo{width:85%;height:auto;filter:none;animation:none;transform-origin:center center;backface-visibility:visible}
.splash-name{font-size:29px;font-weight:800;letter-spacing:5px;color:#124c83;opacity:0;visibility:hidden;transition:opacity .2s ease}
.splash-sub{display:none}
.splash.show-title .splash-name{opacity:1;visibility:visible}
@keyframes gxSpin{0%{transform:rotateY(0deg) scale(.76);opacity:.15}25%{opacity:1}70%{transform:rotateY(540deg) scale(1.05)}100%{transform:rotateY(720deg) scale(1)}}
.tile .ico{display:flex;align-items:center;justify-content:flex-start;height:52px;margin-bottom:13px;color:var(--blue)}
.tile .ico svg{width:58px;height:50px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:740px){.brand-logo{width:143px}.brand-caption{font-size:11px}.tile .ico svg{width:53px}}
/* iOS Safari: jednoduchá 2D rotace bez 3D perspektivy a filtru na animovaném prvku. */
.splash-orbit{ -webkit-perspective:none;perspective:none; }
.splash-logo{ -webkit-animation:none!important;animation:none!important; -webkit-transform-origin:center center;transform-origin:center center; -webkit-backface-visibility:visible;backface-visibility:visible; }
.splash.is-playing .splash-logo{
  -webkit-animation:gxIOSRotate 1.7s ease-in-out both!important;
  animation:gxIOSRotate 1.7s ease-in-out both!important;
}
@-webkit-keyframes gxIOSRotate{
  0%{-webkit-transform:rotate(0deg) scale(.78);opacity:.2}
  15%{opacity:1}
  80%{-webkit-transform:rotate(330deg) scale(1.04)}
  100%{-webkit-transform:rotate(360deg) scale(1);opacity:1}
}
@keyframes gxIOSRotate{
  0%{transform:rotate(0deg) scale(.78);opacity:.2}
  15%{opacity:1}
  80%{transform:rotate(330deg) scale(1.04)}
  100%{transform:rotate(360deg) scale(1);opacity:1}
}

/* Startovací logo: přiletí shora, měkce dosedne a lehce se zhoupne. */
.splash.is-playing .splash-logo{
 -webkit-animation:gxBalloonLand 1.7s both!important;
 animation:gxBalloonLand 1.7s both!important;
}
@-webkit-keyframes gxBalloonLand{
 0%{-webkit-transform:translate3d(0,-110vh,0) rotate(-13deg) scale(.72);opacity:0}
 32%{opacity:1}

<script>
'use strict';
const splash=document.getElementById('splash');
function dismissSplash(){splash.classList.add('done')}
async function playSplash(){
const scene=document.getElementById('gxScene'),truck=document.getElementById('gxTruck'),led=document.getElementById('gxLed'),brand=document.getElementById('gxBrand'),w1=document.getElementById('gxWheel1'),w2=document.getElementById('gxWheel2');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
await wait(350);
await new Promise(resolve=>{let start;function frame(now){if(start===undefined)start=now;const p=Math.min((now-start)/1500,1);truck.setAttribute('transform','translate('+(-95+475*p)+' 0)');w1.setAttribute('transform','rotate('+p*3000+' 22 145)');w2.setAttribute('transform','rotate('+p*3000+' 52 145)');led.setAttribute('stroke',p>.2&&p<.85?'#ff1010':'#a9b6c1');led.setAttribute('stroke-width',p>.2&&p<.85?'12':'7');led.style.filter=p>.2&&p<.85?'drop-shadow(0 0 12px red) drop-shadow(0 0 20px red)':'none';if(p<1)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});
await scene.animate([{opacity:1},{opacity:0}],{duration:250,fill:'forwards'}).finished;scene.style.display='none';await wait(100);brand.style.display='inline';brand.style.opacity='1';await brand.animate([{opacity:0},{opacity:1}],{duration:450}).finished;await wait(1000);dismissSplash();
}
playSplash().catch(dismissSplash);

/* Integrace: backend musí ověřit identitu a roli na serveru. Zatím jde o bezpečně read-only prototyp. */
const API_URL='https://script.google.com/macros/s/AKfycbz_EfRgBr1ctjvzbhRvRwPKdsc3oXPQjscafo0SLuqpBjBiNo2kNKxafW2tC73_DYBLMg/exec';
const categories=[{"id":"UWB","name":"UWB","desc":"","icon":"<svg viewBox=\"0 0 64 64\" aria-hidden=\"true\"><circle cx=\"32\" cy=\"32\" r=\"6\" fill=\"currentColor\"/><path d=\"M22.102 22.102 A14 14 0 0 0 22.102 41.897999999999996 M41.897999999999996 22.102 A14 14 0 0 1 41.897999999999996 41.897999999999996\"/><path d=\"M15.739 15.739 A23 23 0 0 0 15.739 48.260999999999996 M48.260999999999996 15.739 A23 23 0 0 1 48.260999999999996 48.260999999999996\"/><path d=\"M10.790000000000003 10.790000000000003 A30 30 0 0 0 10.790000000000003 53.209999999999994 M53.209999999999994 10.790000000000003 A30 30 0 0 1 53.209999999999994 53.209999999999994\"/></svg>"},{"id":"PROJEKCE","name":"Projekce","desc":"","icon":"<svg viewBox=\"0 0 64 64\" aria-hidden=\"true\"><path d=\"M17 5H47M32 5V15\"/><rect x=\"14\" y=\"15\" width=\"36\" height=\"21\" rx=\"5\" fill=\"currentColor\"/><circle cx=\"32\" cy=\"26\" r=\"6\" fill=\"white\" stroke=\"none\"/><path d=\"M24 40L11 57H53L40 40\" fill=\"currentColor\" fill-opacity=\".12\"/><path d=\"M6 59H58\"/></svg>"},{"id":"LED","name":"LED signalizace","desc":"","icon":"<svg viewBox=\"0 0 64 64\" aria-hidden=\"true\"><path d=\"M5 18H59\" stroke-width=\"5\"/><path d=\"M9 23H55A23 23 0 0 1 9 23Z\" fill=\"currentColor\"/><path d=\"M17 28Q19 38 29 40\" stroke=\"white\"/><path d=\"M7 43L2 48M19 51L16 57M32 53V60M45 51L48 57M57 43L62 48\"/></svg>"},{"id":"AI","name":"AI kamery","desc":"","icon":"<svg viewBox=\"0 0 64 64\" aria-hidden=\"true\"><path d=\"M5 45V31H15V17H34L42 45Z\" fill=\"currentColor\"/><path d=\"M20 22H30L36 35H20Z\" fill=\"white\" stroke=\"none\"/><circle cx=\"14\" cy=\"48\" r=\"7\" fill=\"currentColor\" stroke=\"white\"/><circle cx=\"34\" cy=\"48\" r=\"7\" fill=\"currentColor\" stroke=\"white\"/><path d=\"M44 17V49H59\" stroke-width=\"5\"/><rect x=\"32\" y=\"6\" width=\"20\" height=\"11\" rx=\"3\" fill=\"currentColor\"/><circle cx=\"47\" cy=\"11.5\" r=\"3\" fill=\"white\" stroke=\"none\"/><path d=\"M56 7L62 3M57 13H63\"/></svg>"},{"id":"BRANKY","name":"Branky a závory","desc":"","icon":"<svg viewBox=\"0 0 64 64\" aria-hidden=\"true\"><rect x=\"5\" y=\"19\" width=\"7\" height=\"39\" rx=\"1\" fill=\"currentColor\"/><rect x=\"52\" y=\"19\" width=\"7\" height=\"39\" rx=\"1\" fill=\"currentColor\"/><path d=\"M12 25H52V48H12Z M12 25L52 48 M12 48L52 25\"/><rect x=\"5\" y=\"6\" width=\"7\" height=\"10\" rx=\"2\" fill=\"currentColor\"/><path d=\"M1 4L3 6M16 4L14 6M8.5 0V2\"/></svg>"},{"id":"OSTATNI","name":"Ostatní","desc":"","icon":"<svg viewBox=\"0 0 64 64\" aria-hidden=\"true\"><path d=\"M26 4H38L40 12L46 15L54 13L60 23L54 29V35L60 41L54 51L46 49L40 52L38 60H26L24 52L18 49L10 51L4 41L10 35V29L4 23L10 13L18 15L24 12Z\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"32\" cy=\"32\" r=\"11\" fill=\"white\" stroke=\"none\"/></svg>"}];
let records=[];let currentUser=null;let loadError='';
const app=document.getElementById('app');const adminButton=document.getElementById('adminButton');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const date=s=>{if(!s)return '—';const d=new Date(s);return Number.isNaN(d.getTime())?'—':d.toLocaleDateString('cs-CZ')};
const cat=id=>categories.find(x=>x.id===id);
const sorted=()=>[...records].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
function card(r){return `<button type="button" class="record" data-open="${esc(r.id)}"><strong>${esc(r.title)}</strong><div class="meta">${esc(cat(r.category)?.name||r.category)} · ${date(r.createdAt)} · ${esc(r.authorName)}</div><div class="excerpt">${esc(String(r.body||'').slice(0,150))}${String(r.body||'').length>150?'…':''}</div>${r.attachments?.length?`<div class="meta">📎 ${r.attachments.length} příloh</div>`:''}</button>`}
function heading(title,subtitle=''){return `<section class="hero"><h1>${esc(title)}</h1>${subtitle?`<p>${esc(subtitle)}</p>`:''}<input class="search" id="search" type="search" placeholder="Hledat v technických záznamech…" aria-label="Hledat záznamy"></section>`}
function bindSearch(source){const input=document.getElementById('search'),target=document.getElementById('results'),label=document.getElementById('listTitle');if(!input||!target)return;const initial=target.innerHTML;const initialLabel=label?.textContent;input.addEventListener('input',()=>{const query=norm(input.value.trim());if(!query){target.innerHTML=initial;if(label)label.textContent=initialLabel;return}const terms=query.split(/\s+/).filter(Boolean);const filtered=sorted().filter(r=>{const haystack=norm([r.title,r.body,r.category,cat(r.category)?.desc,r.authorName,...(r.attachments||[]).map(x=>x.name)].join(' '));return terms.every(term=>haystack.includes(term))});if(label)label.textContent='Výsledky hledání ('+filtered.length+')';target.innerHTML=filtered.length?filtered.map(card).join(''):'<div class="empty">Žádné odpovídající záznamy.</div>'})}
function home(){const all=sorted();app.innerHTML=heading('Hledej napříč tématy')+`<h2 id="listTitle">Kategorie</h2><div id="results"><div class="grid">${categories.map(c=>`<a class="tile" href="#category/${c.id}"><span class="ico">${c.icon}</span><strong>${esc(c.name)}</strong></a>`).join('')}</div></div>`;bindSearch(all)}
function category(id){const c=cat(id);if(!c)return home();const all=sorted().filter(r=>r.category===id);app.innerHTML=`<button class="back" data-back="#technika">← Záznamy</button>`+heading(c.name,c.desc)+`<h2 id="listTitle">Záznamy</h2><div id="results">${all.length?all.map(card).join(''):'<div class="empty">V této sekci zatím nejsou žádné záznamy.</div>'}</div>`;bindSearch(all)}
function detail(id){const r=records.find(x=>x.id===id);if(!r)return home();const files=(r.attachments||[]).filter(f=>f.id);app.innerHTML=`<button class="back" data-back="#category/${esc(r.category)}">← ${esc(cat(r.category)?.name||r.category)}</button><section class="hero"><span class="badge">${esc(cat(r.category)?.name||r.category)}</span><h1 style="margin-top:12px">${esc(r.title)}</h1><p>${date(r.createdAt)} · Zapsal(a): ${esc(r.authorName)}</p></section><div class="panel"><h2 style="margin-top:0">Informace</h2><div class="content">${esc(r.body)}</div>${files.length?`<h2>Přílohy</h2><div class="attachments">${files.map(f=>`<button type="button" class="attachment" data-download="${esc(f.id)}">📎 ${esc(f.name)} ↓</button>`).join('')}</div>`:''}</div>`}
function editor(){if(currentUser?.role!=='admin')return home();app.innerHTML=`<button class="back" data-back="#">← Zpět</button><section class="hero"><h1>Nový technický záznam</h1><p>Datum a autor se doplní automaticky.</p></section><div class="notice">Pro ukládání záznamů a souborů je potřeba připojit zabezpečený backend Google Apps Script. Tento formulář zatím nic neodesílá.</div><form id="entryForm" class="panel"><div class="field"><label for="entryCat">Oblast</label><select id="entryCat">${categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><div class="field"><label for="entryDate">Datum</label><input id="entryDate" disabled value="${new Date().toLocaleDateString('cs-CZ')}"></div><div class="field"><label for="entryAuthor">Autor</label><input id="entryAuthor" disabled value="${esc(currentUser.name)}"></div><div class="field"><label for="entryTitle">Název záznamu</label><input id="entryTitle" required maxlength="160" placeholder="Například montáž RFID čtečky"></div><div class="field"><label for="entryBody">Text záznamu</label><textarea id="entryBody" required placeholder="Postup, upozornění, technické poznámky…"></textarea></div><div class="field"><label for="entryFiles">Přílohy</label><input id="entryFiles" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt"></div><button class="btn" type="submit" disabled>Uložit záznam (po připojení backendu)</button></form>`}

function render(){
  if(!authenticated)return;
  const hash=decodeURIComponent(location.hash.slice(1));

  if(hash.startsWith('category/')){
    category(hash.slice(9));
  }else if(hash.startsWith('record/')){
    detail(hash.slice(7));
  }else if(hash==='new'){
    editor();
  }else if(hash==='technika'){
    home();
  }else if(hash==='galerie'){
    galleryHome();
  }else{
    mainMenu();
  }

  if(loadError){
    const p=document.createElement('div');
    p.className='notice';
    p.textContent=loadError;
    app.prepend(p);
  }
}
async function galleryHome(){
  const g = generation;

  app.innerHTML = `
    <button class="back" data-back="#">← Úvod</button>
    <section class="hero">
      <h1>Galerie řešení</h1>
      <p>Fotografie a videa realizací</p>
    </section>
    <div id="galleryResults" class="empty">
      Načítám galerii…
    </div>`;

  const target = document.getElementById('galleryResults');

  try {
    const data = await api('gallery');

    if(g !== generation || !target.isConnected) return;

    if(!data.success){
      throw new Error(data.error);
    }

    target.className = 'grid';

    target.innerHTML = data.categories.map(c => `
      <button class="tile" type="button"
        data-gallery="${esc(c.id)}">
        <span class="ico">
          <svg viewBox="0 0 64 64">
            <path d="M5 15H25L31 22H59V54H5Z"/>
          </svg>
        </span>
        <strong>${esc(c.name)}</strong>
        <span>${c.items.length} souborů</span>
      </button>
    `).join('');

    target.onclick = e => {
      const b = e.target.closest('[data-gallery]');
      if(!b) return;

      const category = data.categories.find(
        c => c.id === b.dataset.gallery
      );

      if(category) galleryCategory(category);
    };

  } catch(err){
    target.textContent = 'Chyba načítání: ' + err.message;
  }
}
function galleryCategory(category){
  app.innerHTML = `
    <button class="back" id="galleryBack">
      ← Galerie
    </button>
    <section class="hero">
      <h1>${esc(category.name)}</h1>
      <p>${category.items.length} souborů</p>
    </section>
    <div class="grid" id="galleryItems"></div>`;

  document.getElementById('galleryBack').onclick =
    galleryHome;

  const target = document.getElementById('galleryItems');
  const g = generation;

  if(!category.items.length){
    target.innerHTML =
      '<div class="empty">Kategorie je zatím prázdná.</div>';
    return;
  }

  for(const item of category.items){
    const tile = document.createElement('button');
    tile.className = 'tile';
    tile.type = 'button';

    const preview = document.createElement('div');
    preview.style.cssText =
      'width:100%;aspect-ratio:4/3;display:grid;place-items:center;background:#eef4fa;border-radius:9px;overflow:hidden';

    preview.textContent = item.type === 'video'
      ? '▶ Video'
      : 'Načítám fotografii…';

    const name = document.createElement('span');
    name.textContent = item.name;
    name.style.cssText =
      'margin-top:10px;overflow-wrap:anywhere';

    tile.append(preview,name);
    target.append(tile);

    if(item.type === 'video'){
      tile.onclick = () => {
        window.open(item.url,'_blank','noopener,noreferrer');
      };
      continue;
    }

    let photo = null;

    tile.onclick = async () => {
      try{
        const data = photo || await api(
          'galleryImage',{fileId:item.id}
        );

        if(g !== generation || !tile.isConnected) return;
        if(!data.success) throw new Error(data.error);

        await showAttachment(data);
      }catch(err){
        alert(err.message);
      }
    };

    const observer = new IntersectionObserver(async entries => {
      if(!entries.some(e => e.isIntersecting)) return;
      observer.disconnect();

      try{
        const data = await api(
          'galleryImage',{fileId:item.id}
        );

        if(g !== generation || !tile.isConnected) return;
        if(!data.success) throw new Error(data.error);

        photo = data;

        const img = document.createElement('img');
        img.src = 'data:' + data.mimeType +
          ';base64,' + data.base64;

        img.alt = item.name;
        img.style.cssText =
          'width:100%;height:100%;object-fit:cover';

        preview.replaceChildren(img);

      }catch(err){
        preview.textContent = 'Náhled není dostupný';
      }
    });

    observer.observe(tile);
  }
}document.addEventListener('click',e=>{const rec=e.target.closest('[data-open]');if(rec)location.hash='record/'+encodeURIComponent(rec.dataset.open);const back=e.target.closest('[data-back]');if(back)location.hash=back.dataset.back});adminButton.addEventListener('click',()=>location.hash='new');window.addEventListener('hashchange',render);

let token=localStorage.getItem('gx_session')||'',authenticated=false;
let generation=0;
const logout=document.getElementById('logout');
async function api(action,extra={}){
 const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action,token,...extra}),credentials:'omit',redirect:'follow'});
 if(!res.ok)throw new Error('Služba není dostupná.');
 return res.json();
}
function loginScreen(message=''){
 generation++;authenticated=false;records=[];logout.classList.add('hide');document.getElementById('appHeader').classList.add('hide');
 app.innerHTML='<section class="panel" style="max-width:420px;margin:30px auto"><img src="GXAS.png" alt="GX ActiveSafety" style="display:block;width:100px;margin:auto"><h2>Přihlášení technika</h2><form id="loginForm"><div class="field"><label for="password">Přístupové heslo</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" type="submit">Přihlásit se</button><p id="loginStatus" role="status"></p></form></section>';
 const status=document.getElementById('loginStatus');status.textContent=message;
 document.getElementById('loginForm').onsubmit=async e=>{
 e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;status.textContent='Ověřuji…';
 try{const data=await api('login',{password:document.getElementById('password').value});if(!data.success)throw new Error(data.error||'Přihlášení selhalo.');token=data.token;localStorage.setItem('gx_session',token);await init();}
 catch(err){status.textContent=err.message;button.disabled=false;}
 };
}
logout.onclick=()=>{token='';localStorage.removeItem('gx_session');loginScreen();};
async function init(){
 if(!token)return loginScreen();
 const g=++generation;
 app.innerHTML='<div class="empty">Načítám záznamy…</div>';
 try{
 const data=await api('records');if(g!==generation)return;
 if(!data.success){token='';localStorage.removeItem('gx_session');return loginScreen(data.error);}
 if(!Array.isArray(data.records))throw new Error('Neplatná odpověď služby.');
 records=data.records.filter(r=>r&&(r.section==='ACTIVESAFETY'||categories.some(c=>c.id===r.section))).map(r=>({id:String(r.id||''),category:r.section==='ACTIVESAFETY'?'OSTATNI':r.section,title:String(r.title||''),body:String(r.content||''),createdAt:r.date,authorName:String(r.author||''),attachments:Array.isArray(r.attachments)?r.attachments.filter(f=>f&&f.id).map(f=>({name:String(f.name||'Příloha'),id:String(f.id)})):[]}));
 authenticated=true;document.getElementById('appHeader').classList.remove('hide');logout.classList.remove('hide');render();
 }catch(err){if(g===generation)loginScreen('Nepodařilo se připojit: '+err.message);}
}
let closePreview=()=>{};
async function showAttachment(data){
 closePreview();
 const bytes=Uint8Array.from(atob(data.base64),c=>c.charCodeAt(0));
 const name=data.name||'priloha',ext=name.split('.').pop().toLowerCase();
 const types={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif',bmp:'image/bmp'};
 const mime=types[ext]||data.mimeType||'application/octet-stream';
 const url=URL.createObjectURL(new Blob([bytes],{type:mime}));
 const download=()=>{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();};
 if(mime!=='application/pdf'&&!mime.startsWith('image/')){download();setTimeout(()=>URL.revokeObjectURL(url),60000);return;}
 const overlay=document.createElement('div');overlay.style.cssText='position:fixed;inset:0;z-index:99999;background:#fff;color:#222;display:flex;flex-direction:column';
 const bar=document.createElement('div');bar.style.cssText='display:flex;align-items:center;gap:8px;padding:12px;flex-wrap:wrap;background:#eee;padding-top:max(12px,env(safe-area-inset-top))';
 const title=document.createElement('strong');title.textContent=name;title.style.cssText='flex:1;overflow-wrap:anywhere;min-width:100px';bar.append(title);
 const button=(label,fn)=>{const b=document.createElement('button');b.textContent=label;b.style.cssText='padding:10px;color:#222;background:#fff;border:1px solid #aaa;border-radius:6px';b.onclick=fn;bar.append(b);return b;};
 const body=document.createElement('div');body.style.cssText='flex:1;overflow:auto;text-align:center;background:#ddd;padding:8px';
 let closed=false,doc=null;closePreview=()=>{closed=true;overlay.remove();URL.revokeObjectURL(url);if(doc)doc.destroy();closePreview=()=>{};};
 button('Uložit',download);button('Zavřít',()=>closePreview());overlay.append(bar,body);document.body.append(overlay);
 if(mime.startsWith('image/')){const img=document.createElement('img');img.src=url;img.style.cssText='max-width:100%;height:auto';img.alt=name;body.append(img);return;}
 body.textContent='Načítám PDF…';
 try{
 const pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');
 pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
 doc=await pdfjs.getDocument({data:bytes,isEvalSupported:false}).promise;if(closed){doc.destroy();return;}
 let page=1,zoom=1,busy=false;const label=document.createElement('span');bar.append(label);
 const draw=async()=>{if(busy||closed)return;busy=true;try{const p=await doc.getPage(page);if(closed)return;const base=p.getViewport({scale:1});const scale=Math.min(2,Math.max(.2,(body.clientWidth-20)/base.width))*zoom;const ratio=Math.min(devicePixelRatio||1,2);const viewport=p.getViewport({scale:scale*ratio});const canvas=document.createElement('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);canvas.style.width=(viewport.width/ratio)+'px';canvas.style.height=(viewport.height/ratio)+'px';await p.render({canvasContext:canvas.getContext('2d'),viewport}).promise;if(!closed){body.replaceChildren(canvas);label.textContent=page+' / '+doc.numPages;}}finally{busy=false;}};
 button('‹',()=>{if(!busy&&page>1){page--;draw();}});button('›',()=>{if(!busy&&page<doc.numPages){page++;draw();}});button('−',()=>{if(!busy){zoom=Math.max(.5,zoom-.25);draw();}});button('+',()=>{if(!busy){zoom=Math.min(3,zoom+.25);draw();}});await draw();
 }catch(err){if(!closed)body.textContent='Náhled PDF se nepodařilo načíst. Použij tlačítko Uložit.';}
}
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-download]');if(!b||!authenticated)return;
 b.disabled=true;const g=generation;
 try{const data=await api('download',{fileId:b.dataset.download});if(g!==generation)return;if(!data.success)throw new Error(data.error||'Stažení selhalo.');await showAttachment(data);}
 catch(err){alert(err.message);}finally{b.disabled=false;}
});
init();
</script>
