<!doctype html>
<html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>GX Technik · Montážní příručka</title>
<style>
:root{--ink:#132437;--blue:#094889;--line:#d6dfe5;--paper:#f3f6f8;font:16px/1.5 Inter,Arial,sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:var(--blue)}header,footer{background:white;border-block:1px solid var(--line)}.wrap,main{width:min(1060px,calc(100% - 40px));margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;padding-block:16px}.word{font-size:22px;font-weight:800;text-decoration:none;color:var(--ink)}.word b{background:var(--ink);color:white;padding:4px 9px;font-style:italic;border-radius:5px}.action{border:0;border-radius:7px;padding:10px 16px;background:var(--blue);color:white;font-weight:650}main{min-height:75vh;padding-block:30px 56px}.hero{position:relative;overflow:hidden;background:linear-gradient(115deg,#073769,#094889);color:white;padding:clamp(24px,5vw,60px);border-radius:16px}.hero:before{content:'';position:absolute;inset:0 0 0 45%;opacity:.26;background:repeating-radial-gradient(circle at 100% 85%,transparent 0 27px,#85c6ea 28px 29px,transparent 30px 50px);pointer-events:none}.hero>*{position:relative}small{font-size:12px;letter-spacing:.1em;font-weight:bold;text-transform:uppercase}h1{font-size:clamp(34px,5vw,58px);letter-spacing:-.055em;line-height:1.05;margin:12px 0 25px}input{width:100%;padding:13px 15px;border:1px solid #9caebc;border-radius:7px;min-width:0}.hero input{max-width:550px}h2{font-size:24px;letter-spacing:-.04em;margin:32px 0 13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{color:inherit;text-decoration:none;display:flex;gap:16px;align-items:center;background:white;padding:22px;border:1px solid var(--line);border-radius:10px}.tile:hover,.tile:focus-visible{border-color:var(--blue);background:#fafdff}.icon{display:grid;place-items:center;width:54px;height:54px;flex:none;background:#e6eff8;color:var(--blue);border-radius:10px}.tile strong,.tile span em{display:block}.tile strong{font-size:19px}.tile em{font-size:14px;color:#516475;font-style:normal}.arrow{margin-left:auto;color:var(--blue)}.back{display:inline-block;margin-bottom:20px}.panel,details{background:white;border:1px solid var(--line);border-radius:10px;padding:20px;margin:12px 0}summary{cursor:pointer;font-weight:bold}dialog{width:min(450px,calc(100% - 24px));border:1px solid var(--line);border-radius:14px;padding:20px;color:var(--ink)}dialog::backdrop{background:#11243388}.chathead{display:flex;align-items:center;justify-content:space-between}.chathead h2{margin:0}.close{background:white;border:1px solid var(--line);border-radius:6px;padding:6px 12px}.log{max-height:36vh;overflow:auto}.log p{background:var(--paper);border-radius:8px;padding:10px}.log .user{background:#dfecf7;margin-left:24px}form{display:flex;gap:6px;margin-top:12px}footer{font-size:13px;color:#516475;padding-block:17px}.splash{position:fixed;inset:0;z-index:4;background:#162b3f;display:grid;place-content:center;text-align:center;color:white;pointer-events:none;visibility:hidden}.splash img{width:165px;max-height:80px;object-fit:contain;filter:brightness(0) invert(1)}.splash strong{display:block;font-size:28px}@keyframes turn{from{transform:perspective(600px) rotateY(-360deg)}to{transform:perspective(600px) rotateY(0)}}@keyframes dismiss{to{visibility:hidden;opacity:0}}@media(max-width:620px){.grid{grid-template-columns:1fr}.tile{padding:15px}.wrap,main{width:calc(100% - 32px)}main{padding-top:16px}}

.mobile-nav { display: none; }
.log p { overflow-wrap: anywhere; }
@media (max-width: 760px) {
  body { padding-bottom: calc(66px + env(safe-area-inset-bottom)); }
  .wrap, main { width: calc(100% - 32px); }
  .bar { padding-block: 9px; }
  .word, .back { display: inline-flex; align-items: center; min-height: 44px; gap: 6px; }
  #ask { display: none; }
  main { padding-block: 12px 28px; min-height: auto; }
  .hero { padding: 18px; border-radius: 12px; }
  h1 { font-size: clamp(28px, 7vw, 36px); margin: 6px 0 14px; }
  h1:last-child { margin-bottom: 0; }
  h2 { font-size: 22px; margin: 20px 0 10px; }
  .grid { grid-template-columns: 1fr; gap: 8px; }
  .tile { gap: 12px; padding: 12px; }
  .icon { width: 44px; height: 44px; }
  .back { margin-bottom: 4px; }
  details { padding: 0 16px; }
  summary { padding-block: 14px; }
  .mobile-nav { display: flex; position: fixed; bottom: 0; inset-inline: 0; z-index: 2;
    padding: 6px 16px calc(6px + env(safe-area-inset-bottom)); gap: 8px;
    background: white; border-top: 1px solid var(--line); }
  .mobile-nav > * { flex: 1; min-height: 48px; display: grid; place-items: center;
    text-decoration: none; font-weight: bold; border-radius: 7px; }
  .mobile-nav a { background: #e6eff8; }
  dialog[open] { margin: 0; inset: auto 0 0; width: 100%; max-width: none;
    height: min(600px, 100dvh); max-height: 100dvh; display: flex; flex-direction: column;
    border-radius: 18px 18px 0 0; padding: 16px 16px calc(12px + env(safe-area-inset-bottom)); }
  dialog > p { margin-block: 10px; }
  .log { flex: 1; min-height: 0; max-height: none; }
  body:has(dialog[open]) { overflow: hidden; }
  .close, form button { min-height: 44px; }
}

.word { display: inline-flex; align-items: center; gap: 14px; }
.word span { border-left: 1px solid #b9cce0; padding-left: 14px; color: var(--blue); }
.gx-logo { display: block; width: 135px; height: auto; }
.splash { background: #fff; color: var(--blue); }
.splash img { width: 169px; filter: none; }
.splash strong { margin-top: 12px; font-size: 20px; }
@media(max-width:760px){ .word .gx-logo { width: 112px; } .word span { font-size: 19px; } }

.splash.is-playing { visibility: visible; animation: dismiss .24s 1.65s forwards; }
.splash.is-playing img { animation: turn 1.45s ease-in-out both; }
@media (prefers-reduced-motion: reduce) {
  .splash.is-playing img { animation: none; }
  .splash.is-playing { animation-delay: .65s; }
}
</style>

<header><div class="wrap bar"><a href="#" class="word"><img class="gx-logo" width="169" height="51" alt="GX solutions" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22169%22%20height%3D%2251%22%20viewBox%3D%220%200%20169%2051%22%3E%3Cdefs%3E%3Cmask%20id%3D%22cut%22%3E%3Crect%20width%3D%2251%22%20height%3D%2251%22%20fill%3D%22white%22%2F%3E%3Ctext%20x%3D%22-1%22%20y%3D%2251%22%20font-family%3D%22Arial%2Csans-serif%22%20font-size%3D%2236%22%20font-weight%3D%22900%22%20letter-spacing%3D%22-3%22%3EGX%3C%2Ftext%3E%3C%2Fmask%3E%3C%2Fdefs%3E%3Cg%20fill%3D%22%23094889%22%3E%3Crect%20width%3D%2251%22%20height%3D%2251%22%20rx%3D%226%22%20mask%3D%22url(%23cut)%22%2F%3E%3Ctext%20x%3D%2254%22%20y%3D%2241%22%20font-family%3D%22Arial%2Csans-serif%22%20font-size%3D%2229%22%20letter-spacing%3D%22-1.5%22%3Esolutions%3C%2Ftext%3E%3Ctext%20x%3D%22161%22%20y%3D%2219%22%20font-family%3D%22Arial%2Csans-serif%22%20font-size%3D%228%22%3E%C2%AE%3C%2Ftext%3E%3C%2Fg%3E%3C%2Fsvg%3E"><span>Technik</span></a><button class="action" id="ask">Poradna GX</button></div></header>

<script>
const splash = document.querySelector('.splash');
function showOpeningLogo() {
  if (document.visibilityState !== 'visible' || splash.classList.contains('is-playing')) return;
  splash.classList.add('is-playing');
}
function resetOpeningLogo() {
  splash.classList.remove('is-playing');
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) resetOpeningLogo();
  else showOpeningLogo();
});
window.addEventListener('pagehide', resetOpeningLogo);
window.addEventListener('pageshow', showOpeningLogo);
showOpeningLogo();

const groups=[
 {name:'Vysokozdvižné vozíky',tag:'VZV · manipulační technika',modules:['GX ActiveSafety','GX Store'],icon:'M3 15h4V8h7l3 7v3H3z M8 8v7h8 M19 4v15h5 M6 18a2 2 0 1 0 .1 0 M15 18a2 2 0 1 0 .1 0'},
 {name:'Nákladní vozidla',tag:'Trucky · tahače',modules:['GX Truck'],icon:'M2 6h13v11H2z M15 10h4l4 4v3h-8 M6 17a2 2 0 1 0 .1 0 M19 17a2 2 0 1 0 .1 0'},
 {name:'Autobusy',tag:'Osobní doprava',modules:['Palubní jednotka'],icon:'M2 6h19l2 6v5H2z M3 12h18 M8 7v5 M14 7v5 M6 17a2 2 0 1 0 .1 0 M19 17a2 2 0 1 0 .1 0'},
 {name:'Pracovní stroje',tag:'Stavební a provozní technika',modules:['GX Build'],icon:'M2 17h12a2 2 0 0 1 0 4H2a2 2 0 0 1 0-4z M5 17v-7h6l2 7 M12 12l4-9 5 9 M21 12l2 4h-5z'}];
const main=document.querySelector('main');
const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const escapeText=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function tile(group,i,j){
 const module=j!==undefined;
 return '<a class="tile" href="#g/'+i+(module?'/'+j:'')+'"><span class="icon"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="'+group.icon+'"/></svg></span><span><strong>'+(module?group.modules[j]:group.name)+'</strong><em>'+(module?group.name:group.tag)+'</em></span><b class="arrow" aria-hidden="true">→</b></a>';
}
function results(value){
 const q=normalize(value);
 const cards=[];

 // Katalog podsekcí a dokumentace
 const entries=[
  {
   title:'GX Store',
   subtitle:'Systém pro vysokozdvižné vozíky',
   href:'#g/0/1',
   keywords:'store vzv voziky vysokozdvizne'
  },
  {
   title:'Obecná zapojení VZV',
   subtitle:'GX Store · Elektrická schémata',
   href:'#g/0/1/wiring',
   keywords:'obecne zapojeni schema schemata vzv elektro'
  },
  {
   title:'Jungheinrich EFG 2xx',
   subtitle:'GX Store · Schéma zapojení 48 V',
   href:'#g/0/1/efg2xx',
   keywords:'jungheinrich efg 2xx efg2xx 48v 48 v schema zapojeni pdf maier tdm-q uwb rfid gocan'
  },
  {
   title:'Moduly a zařízení',
   subtitle:'GX Store · Technická dokumentace',
   href:'#g/0/1/modules',
   keywords:'moduly zarizeni jednotky tdm uwb rfid gocan'
  },
  {
   title:'Montážní postupy',
   subtitle:'GX Store · Instalace',
   href:'#g/0/1/installation',
   keywords:'montazni postup instalace kontrola'
  },
  {
   title:'Diagnostika a řešení problémů',
   subtitle:'GX Store · Servis',
   href:'#g/0/1/diagnostics',
   keywords:'diagnostika poruchy problemy zavady servis'
  }
 ];

 // Původní hlavní kategorie a moduly
 groups.forEach((g,i)=>{
  if(!q || normalize(g.name+' '+g.tag).includes(q)){
   cards.push(tile(g,i));
  }

  if(q){
   g.modules.forEach((m,j)=>{
    if(normalize(m).includes(q) && !(i===0 && j===1)){
     cards.push(tile(g,i,j));
    }
   });
  }
 });

 // Vyhledávání uvnitř podsekcí
 if(q){
  entries.forEach(e=>{
   const searchable=normalize(
    e.title+' '+e.subtitle+' '+e.keywords
   );

   if(searchable.includes(q)){
    cards.push(
     '<a class="tile" href="'+e.href+'">'+
     '<span class="icon" aria-hidden="true">⌕</span>'+
     '<span><strong>'+e.title+'</strong>'+
     '<em>'+e.subtitle+'</em></span>'+
     '<b class="arrow" aria-hidden="true">→</b></a>'
    );
   }
  });
 }

 document.querySelector('#heading').textContent=
  q?'Výsledky hledání':'Typ montáže';

 document.querySelector('#cards').innerHTML=
  cards.join('')||
  '<p>Žádná shoda. Zkus název modulu, zkratku nebo typ vozíku.</p>'
}
function render(){
 const route=location.hash.match(/^#g\/(\d+)(?:\/(\d+))?(?:\/([a-z0-9-]+))?$/);
 const g=route&&groups[route[1]];
 const j=route?.[2];
 const section=route?.[3];
 const isGXStore=route?.[1]==='0'&&j==='1';

 const back=(href,label)=>
   '<a class="back" href="'+href+'">← '+label+'</a>';

 const sectionTile=(title,subtitle,href)=>
   '<a class="tile" href="'+href+'">'+
   '<span class="icon" aria-hidden="true">▣</span>'+
   '<span><strong>'+title+'</strong><em>'+subtitle+'</em></span>'+
   '<b class="arrow" aria-hidden="true">→</b></a>';

 const storeSections=[
  ['Obecná zapojení VZV','Schémata podle značky a typu vozíku','wiring'],
  ['Moduly a zařízení','Technické parametry a návody k modulům','modules'],
  ['Montážní postupy','Postupy instalace a kontrola funkce','installation'],
  ['Diagnostika a řešení problémů','Závady, kontroly a doporučené postupy','diagnostics']
 ];

 if(!g||(j!==undefined&&!g.modules[j])){
  main.innerHTML=
   '<section class="hero"><small>GX Solutions Bohemia</small>'+
   '<h1>Montážní příručka</h1>'+
   '<input id="search" type="search" aria-label="Hledat v příručce" '+
   'placeholder="Hledat modul, stroj nebo označení…"></section>'+
   '<h2 id="heading"></h2><div id="cards" class="grid"></div>';

  const search=document.querySelector('#search');
  search.oninput=()=>results(search.value);
  results('');
  return;
 }

 if(j===undefined){
  main.innerHTML=
   back('#','Příručka')+
   '<section class="hero"><small>Typ montáže</small>'+
   '<h1>'+g.name+'</h1></section>'+
   '<h2>Moduly a systémy</h2>'+
   '<div class="grid">'+
   g.modules.map((m,k)=>tile(g,route[1],k)).join('')+
   '</div>';
  return;
 }

 if(isGXStore){
  const base='#g/0/1';

  if(!section){
   main.innerHTML=
    back('#g/0','Vysokozdvižné vozíky')+
    '<section class="hero"><small>Technická dokumentace GX</small>'+
    '<h1>GX Store</h1>'+
    '<p>Schémata zapojení, moduly, montážní postupy a diagnostika.</p>'+
    '</section>'+
    '<h2>Dokumentace</h2>'+
    '<div class="grid">'+
    storeSections.map(s=>sectionTile(s[0],s[1],base+'/'+s[2])).join('')+
    '</div>';
   return;
  }

  if(section==='wiring'){
   main.innerHTML=
    back(base,'GX Store')+
    '<section class="hero"><small>Technická dokumentace GX</small>'+
    '<h1>Obecná zapojení VZV</h1></section>'+
    '<h2>Schémata podle typu vozíku</h2>'+
    '<div class="grid">'+
    sectionTile(
      'Jungheinrich EFG 2xx',
      'Elektrické schéma zapojení · 48 V DC',
      base+'/efg2xx'
    )+
    '</div>';
   return;
  }

  if(section==='efg2xx'){
   const pdfId='1yzHfHKowxfq0ZTmCdIjTr3Zo7UHJGdKh';
   const pdfPreview='https://drive.google.com/file/d/'+pdfId+'/preview';
   const pdfOpen='https://drive.google.com/file/d/'+pdfId+'/view';

   main.innerHTML=`
    ${back(base+'/wiring','Obecná zapojení VZV')}

    <section class="hero">
     <small>Technická dokumentace GX · Schéma zapojení</small>
     <h1>Jungheinrich EFG 2xx</h1>
     <p>Elektrické schéma instalace systému GX.</p>
    </section>

    <h2>Schéma zapojení</h2>
    <div class="panel">
     <p><strong>Originální výkres – PDF</strong></p>
     <p>Dokument je načítán z Google Drive.</p>

     <div style="width:100%;height:clamp(420px,75vh,850px);
                 background:#edf1f5;border:1px solid #d6dfe5;
                 border-radius:8px;overflow:hidden">
      <iframe
       src="${pdfPreview}"
       title="Schéma zapojení Jungheinrich EFG 2xx"
       style="width:100%;height:100%;border:0"
       loading="lazy"
       allow="fullscreen">
      </iframe>
     </div>

     <p style="margin-top:16px">
      <a class="action"
         style="display:inline-block;text-decoration:none"
         href="${pdfOpen}"
         target="_blank"
         rel="noopener noreferrer">
       Otevřít celé schéma ↗
      </a>
     </p>
    </div>

    <h2>Technický přehled</h2>

    <details open>
     <summary>Základní informace</summary>
     <p><strong>Vozík:</strong> Jungheinrich EFG 2xx</p>
     <p><strong>Napájení vozíku:</strong> 48 V DC</p>
     <p><strong>Typ dokumentu:</strong> Elektrické schéma</p>
    </details>

    <details>
     <summary>Použité komponenty</summary>
     <ul>
      <li>Jednotka TDM-Q</li>
      <li>Čtečka TM-UWB.2</li>
      <li>Čtečka TM-RFID-MIFARE</li>
      <li>Modul TM-GOCAN-RD2</li>
      <li>DC/DC měnič</li>
      <li>Relé SPDT</li>
      <li>GSM a GPS anténa</li>
     </ul>
     <p>Konkrétní svorky a propojení ověř v originálním výkresu.</p>
    </details>

    <details>
     <summary>Montážní poznámky</summary>
     <p>Podrobný montážní postup zatím není vložen.</p>
    </details>
   `;
   return;
  }

  const selected=storeSections.find(s=>s[2]===section);

  if(selected){
   main.innerHTML=
    back(base,'GX Store')+
    '<section class="hero"><small>Technická dokumentace GX</small>'+
    '<h1>'+selected[0]+'</h1></section>'+
    '<div class="panel"><p>Pro tuto sekci zatím nejsou vložené podklady.</p></div>';
   return;
  }

  location.hash=base;
  return;
 }

 if(section){
  location.hash='#g/'+route[1]+'/'+j;
  return;
 }

 main.innerHTML=
  back('#g/'+route[1],g.name)+
  '<section class="hero"><small>Technická dokumentace GX</small>'+
  '<h1>'+g.modules[j]+'</h1></section>'+
  '<h2>Podklady k montáži</h2>'+
  ['Varianty zapojení','Schémata a konektory','Montáž a kontrola funkce']
   .map(t=>'<details><summary>'+t+
    '</summary><p>Pro tuto kartu zatím není vložen schválený podklad.</p></details>')
   .join('');
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
const chat=document.querySelector('#chat'),query=document.querySelector('#query'),log=document.querySelector('#log');
function openChat() { chat.showModal(); query.focus(); }
document.querySelector('#ask').onclick = openChat;
document.querySelector('#mobileAsk').onclick = openChat;
document.querySelector('#closeChat').onclick=()=>chat.close();
document.querySelector('#question').onsubmit=e=>{
 e.preventDefault();const value=query.value.trim();if(!value)return;
 log.insertAdjacentHTML('beforeend','<p class="user">'+escapeText(value)+'</p><p>Pro tento dotaz zatím nemáme schválenou odpověď.</p>');
 query.value='';log.scrollTop=log.scrollHeight;query.focus();
};
</script></html>
