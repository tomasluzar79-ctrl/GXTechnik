<style>
:root{--blue:#094889;--light:#eef4fa;--ink:#182d41;--muted:#607287;--line:#dce5ed;--white:#fff}*{box-sizing:border-box}body{margin:0;background:#f5f8fb;color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1060px;margin:auto;padding:0 18px}header{background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:75px}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--blue)}.brandmark{display:flex;align-items:center;justify-content:center;width:51px;height:51px;border-radius:9px;background:var(--blue);color:#fff;font-weight:900;font-size:25px;letter-spacing:-3px}.brandname{font-size:24px;letter-spacing:-1.4px}.brandname small{display:block;font-size:12px;letter-spacing:.2px;color:var(--muted);margin-top:-6px}.btn{background:var(--blue);border:1px solid var(--blue);border-radius:10px;color:#fff;padding:10px 15px;font-weight:650}.btn.secondary{background:#fff;color:var(--blue)}.btn:disabled{opacity:.5;cursor:not-allowed}main{padding-top:26px;padding-bottom:70px}.hero{background:linear-gradient(115deg,#e7f0f9,#fff);border:1px solid var(--line);border-radius:18px;padding:28px;margin-bottom:24px}.hero h1{color:var(--blue);margin:0 0 6px;font-size:clamp(25px,4vw,36px)}.hero p{color:var(--muted);margin:0 0 18px}.search{width:100%;padding:14px 16px;border:1px solid #b9cad9;border-radius:11px;background:white;outline-color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.tile{display:flex;flex-direction:column;align-items:flex-start;min-height:166px;padding:20px;border:1px solid var(--line);border-radius:15px;background:white;color:var(--ink);text-decoration:none;text-align:left;transition:.15s}.tile:hover,.record:hover{border-color:#9cb9d4;box-shadow:0 5px 20px #163d5e0c}.tile .ico{font-size:40px;line-height:1.1;margin-bottom:16px}.tile strong{color:var(--blue);font-size:18px}.tile span:last-child{font-size:12px;color:var(--muted)}h2{font-size:21px;margin:27px 0 14px}.record{display:block;width:100%;background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px 19px;text-align:left;margin:10px 0;color:var(--ink)}.record strong{font-size:17px}.meta{color:var(--muted);font-size:13px;margin-top:5px}.excerpt{margin-top:8px;color:#465e73;font-size:14px}.empty{background:#fff;border:1px dashed #becfdf;border-radius:13px;padding:28px;text-align:center;color:var(--muted)}.back{background:none;border:0;color:var(--blue);padding:0;margin-bottom:18px;font-weight:650}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:24px}.content{white-space:pre-wrap;overflow-wrap:anywhere}.attachments{display:grid;gap:9px;margin-top:12px}.attachment{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:9px;color:var(--blue);text-decoration:none;overflow-wrap:anywhere}.badge{font-size:12px;font-weight:700;color:var(--blue);background:var(--light);padding:5px 9px;border-radius:20px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spacer{flex:1}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:14px;font-weight:650}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #b9cad9;border-radius:9px;background:#fff}.field textarea{min-height:160px;resize:vertical}.notice{background:#fff7e8;border:1px solid #f0d5a1;color:#68480e;border-radius:11px;padding:13px 16px;margin-bottom:16px;font-size:14px}.status{font-size:13px;color:var(--muted)}.hide{display:none!important}footer{border-top:1px solid var(--line);padding:18px 0;color:var(--muted);font-size:12px}@media(max-width:740px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bar{min-height:66px}.brandname{font-size:19px}.brandmark{width:44px;height:44px;font-size:22px}.hero{padding:19px}.tile{min-height:150px;padding:15px}.panel{padding:17px}.btn{padding:9px 11px}}

/* Firemní logo a úvodní animace */
.brandmark,.brandname{display:none!important}
.brand-logo{display:block;width:169px;max-width:45vw;height:auto;object-fit:contain}
.brand-caption{font-size:12px;color:var(--muted);font-weight:700;margin-left:4px;white-space:nowrap}
.splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#123b66 0%,#061c36 62%,#031326 100%);opacity:1;visibility:visible;transition:opacity .55s ease,visibility .55s ease}
.splash.done{opacity:0;visibility:hidden;pointer-events:none}
.splash-inner{display:flex;flex-direction:column;align-items:center;gap:30px;padding:22px;text-align:center;color:#fff}
.splash-orbit{width:min(76vw,320px);height:min(76vw,320px);border-radius:50%;border:2px solid #169de7;box-shadow:0 0 23px #169de799,inset 0 0 40px #0c74bd44;display:grid;place-items:center;perspective:900px;position:relative}
.splash-orbit::after{content:'';position:absolute;inset:15px;border:1px solid #1b88d46b;border-radius:50%}
.splash-logo{width:76%;height:auto;filter:brightness(0) invert(1) drop-shadow(0 0 6px #58baff);animation:gxSpin 1.8s cubic-bezier(.3,.1,.15,1) both;transform-style:preserve-3d;backface-visibility:visible}
.splash-name{font-size:25px;font-weight:750;letter-spacing:.2px}
.splash-sub{color:#bfd6ee;font-size:13px}
@keyframes gxSpin{0%{transform:rotateY(0deg) scale(.76);opacity:.15}25%{opacity:1}70%{transform:rotateY(540deg) scale(1.05)}100%{transform:rotateY(720deg) scale(1)}}
.tile .ico{display:flex;align-items:center;justify-content:flex-start;height:52px;margin-bottom:13px;color:var(--blue)}
.tile .ico svg{width:58px;height:50px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:740px){.brand-logo{width:143px}.brand-caption{font-size:11px}.tile .ico svg{width:53px}}
/* iOS Safari: jednoduchá 2D rotace bez 3D perspektivy a filtru na animovaném prvku. */
.splash-orbit{ -webkit-perspective:none;perspective:none; }
.splash-logo{ -webkit-animation:none!important;animation:none!important; -webkit-transform-origin:center center;transform-origin:center center; -webkit-backface-visibility:visible;backface-visibility:visible; }
.splash.is-playing .splash-logo{
  -webkit-animation:gxIOSRotate 2s ease-in-out both!important;
  animation:gxIOSRotate 2s ease-in-out both!important;
}
@-webkit-keyframes gxIOSRotate{
  0%{-webkit-transform:rotate(0deg) scale(.78);opacity:.2}
  15%{opacity:1}
  80%{-webkit-transform:rotate(660deg) scale(1.04)}
  100%{-webkit-transform:rotate(720deg) scale(1);opacity:1}
}
@keyframes gxIOSRotate{
  0%{transform:rotate(0deg) scale(.78);opacity:.2}
  15%{opacity:1}
  80%{transform:rotate(660deg) scale(1.04)}
  100%{transform:rotate(720deg) scale(1);opacity:1}
}
</style>

'use strict';
const splash=document.getElementById('splash');
let splashTimer;
function dismissSplash(){
  splash.classList.add('done');
  splash.classList.remove('is-playing');
}
function playSplash(){
  clearTimeout(splashTimer);
  splash.classList.remove('done','is-playing');
  void splash.offsetWidth;
  splash.classList.add('is-playing');
  splashTimer=setTimeout(dismissSplash,2500);
}
playSplash();
window.addEventListener('pageshow',event=>{if(event.persisted)playSplash()});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && splash.classList.contains('done')) playSplash();
});
setTimeout(dismissSplash,2250);
/* Integrace: backend musí ověřit identitu a roli na serveru. Zatím jde o bezpečně read-only prototyp. */
const API_URL='https://script.google.com/macros/s/AKfycbypKqwtRwdssP2Z1leZ0uZjfnyZhB1f5ccAxgnJVWijdjCE0TeAwiLQoM6wMIvP9yJ5Zg/exec'; // Veřejné API pouze pro čtení.
const categories=[
 {id:'VZV',name:'VZV',desc:'Vysokozdvižné vozíky',icon:'<svg viewBox="0 0 64 52" aria-hidden="true"><path d="M6 37h32v8H6z M11 37V15h21v22 M18 15V8h14v7 M22 15v22 M35 9v29 M43 8v34 M43 42h14 M57 42V9"/><circle cx="15" cy="45" r="4"/><circle cx="33" cy="45" r="4"/><path d="M5 29h8 M20 23h10"/></svg>'},
 {id:'TRUCK',name:'TRUCK',desc:'Nákladní vozidla',icon:'<svg viewBox="0 0 64 52" aria-hidden="true"><path d="M4 15h34v27H4z M38 24h12l10 11v7H38z M43 28h6l6 7H43z M5 42h53"/><circle cx="17" cy="43" r="5"/><circle cx="49" cy="43" r="5"/></svg>'},
 {id:'BUILD',name:'BUILD',desc:'Pracovní stroje',icon:'<svg viewBox="0 0 64 52" aria-hidden="true"><path d="M6 41h36v8H6z M12 41V27h18l9 14 M17 27v-8h13l5 8 M30 19l10-10 10 8-8 14 M50 17l10 10-6 9-10-5"/><circle cx="15" cy="45" r="2"/><circle cx="33" cy="45" r="2"/><path d="M41 41h9"/></svg>'},
 {id:'ACTIVESAFETY',name:'ACTIVESAFETY',desc:'Bezpečnostní systémy',icon:'<svg viewBox="0 0 64 52" aria-hidden="true"><path d="M32 4 53 12v14c0 14-9 21-21 25C20 47 11 40 11 26V12z"/><path d="m21 27 8 8 15-17"/></svg>'}
];
let records=[];let currentUser=null;let loadError='';
const app=document.getElementById('app');const adminButton=document.getElementById('adminButton');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const date=s=>{if(!s)return '—';const d=new Date(s);return Number.isNaN(d.getTime())?'—':d.toLocaleDateString('cs-CZ')};
const cat=id=>categories.find(x=>x.id===id);
const sorted=()=>[...records].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
function card(r){return `<button type="button" class="record" data-open="${esc(r.id)}"><strong>${esc(r.title)}</strong><div class="meta">${esc(r.category)} · ${date(r.createdAt)} · ${esc(r.authorName)}</div><div class="excerpt">${esc(String(r.body||'').slice(0,150))}${String(r.body||'').length>150?'…':''}</div>${r.attachments?.length?`<div class="meta">📎 ${r.attachments.length} příloh</div>`:''}</button>`}
function heading(title,subtitle=''){return `<section class="hero"><h1>${esc(title)}</h1>${subtitle?`<p>${esc(subtitle)}</p>`:''}<input class="search" id="search" type="search" placeholder="Hledat název, text, zařízení…" aria-label="Hledat záznamy"></section>`}
function bindSearch(source){const input=document.getElementById('search'),target=document.getElementById('results');input?.addEventListener('input',()=>{const q=norm(input.value.trim());const filtered=source.filter(r=>norm([r.title,r.body,r.category,r.authorName,...(r.attachments||[]).map(x=>x.name)].join(' ')).includes(q));target.innerHTML=filtered.length?filtered.map(card).join(''):'<div class="empty">Žádné odpovídající záznamy.</div>'})}
function home(){const all=sorted();app.innerHTML=heading('Technické informace','Záznamy a přílohy pro montážní a servisní techniky')+`<div class="grid">${categories.map(c=>`<a class="tile" href="#category/${c.id}"><span class="ico">${c.icon}</span><strong>${c.name}</strong><span>${c.desc}</span></a>`).join('')}</div><h2 id="listTitle">Nejnovější záznamy</h2><div id="results">${all.length?all.slice(0,10).map(card).join(''):'<div class="empty">Zatím nejsou vložené žádné záznamy.</div>'}</div>`;bindSearch(all);document.getElementById('search').addEventListener('input',e=>{document.getElementById('listTitle').textContent=e.target.value?'Výsledky vyhledávání':'Nejnovější záznamy';if(!e.target.value)document.getElementById('results').innerHTML=all.length?all.slice(0,10).map(card).join(''):'<div class="empty">Zatím nejsou vložené žádné záznamy.</div>'})}
function category(id){const c=cat(id);if(!c)return home();const all=sorted().filter(r=>r.category===id);app.innerHTML=`<button class="back" data-back="#">← Všechny sekce</button>`+heading(c.name,c.desc)+`<h2>Záznamy</h2><div id="results">${all.length?all.map(card).join(''):'<div class="empty">V této sekci zatím nejsou žádné záznamy.</div>'}</div>`;bindSearch(all)}
function detail(id){const r=records.find(x=>x.id===id);if(!r)return home();const files=(r.attachments||[]).filter(f=>/^https:\/\//.test(f.url||''));app.innerHTML=`<button class="back" data-back="#category/${esc(r.category)}">← ${esc(r.category)}</button><section class="hero"><span class="badge">${esc(r.category)}</span><h1 style="margin-top:12px">${esc(r.title)}</h1><p>${date(r.createdAt)} · Zapsal(a): ${esc(r.authorName)}</p></section><div class="panel"><h2 style="margin-top:0">Informace</h2><div class="content">${esc(r.body)}</div>${files.length?`<h2>Přílohy</h2><div class="attachments">${files.map(f=>`<a class="attachment" href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">📎 ${esc(f.name)} ↗</a>`).join('')}</div>`:''}</div>`}
function editor(){if(currentUser?.role!=='admin')return home();app.innerHTML=`<button class="back" data-back="#">← Zpět</button><section class="hero"><h1>Nový technický záznam</h1><p>Datum a autor se doplní automaticky.</p></section><div class="notice">Pro ukládání záznamů a souborů je potřeba připojit zabezpečený backend Google Apps Script. Tento formulář zatím nic neodesílá.</div><form id="entryForm" class="panel"><div class="field"><label for="entryCat">Oblast</label><select id="entryCat">${categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><div class="field"><label for="entryDate">Datum</label><input id="entryDate" disabled value="${new Date().toLocaleDateString('cs-CZ')}"></div><div class="field"><label for="entryAuthor">Autor</label><input id="entryAuthor" disabled value="${esc(currentUser.name)}"></div><div class="field"><label for="entryTitle">Název záznamu</label><input id="entryTitle" required maxlength="160" placeholder="Například montáž RFID čtečky"></div><div class="field"><label for="entryBody">Text záznamu</label><textarea id="entryBody" required placeholder="Postup, upozornění, technické poznámky…"></textarea></div><div class="field"><label for="entryFiles">Přílohy</label><input id="entryFiles" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt"></div><button class="btn" type="submit" disabled>Uložit záznam (po připojení backendu)</button></form>`}
function render(){const hash=decodeURIComponent(location.hash.slice(1));if(hash.startsWith('category/'))category(hash.slice(9));else if(hash.startsWith('record/'))detail(hash.slice(7));else if(hash==='new')editor();else home();if(loadError){const p=document.createElement('div');p.className='notice';p.textContent=loadError;app.prepend(p)}}
document.addEventListener('click',e=>{const rec=e.target.closest('[data-open]');if(rec)location.hash='record/'+encodeURIComponent(rec.dataset.open);const back=e.target.closest('[data-back]');if(back)location.hash=back.dataset.back});adminButton.addEventListener('click',()=>location.hash='new');window.addEventListener('hashchange',render);
function loadPublicRecords(){return new Promise((resolve,reject)=>{const callback='gxCallback_'+Math.random().toString(36).slice(2,14);const script=document.createElement('script');let settled=false;const timer=setTimeout(()=>finish(new Error('Časový limit načítání')),12000);function finish(err,data){if(settled)return;settled=true;clearTimeout(timer);delete window[callback];script.remove();err?reject(err):resolve(data)}window[callback]=data=>finish(null,data);script.onerror=()=>finish(new Error('Služba není dostupná'));script.src=API_URL+'?callback='+encodeURIComponent(callback);document.head.appendChild(script)})}
async function init(){render();try{const data=await loadPublicRecords();if(!data||data.success!==true||!Array.isArray(data.records))throw new Error('Neplatná odpověď služby');records=data.records.filter(r=>r&&categories.some(c=>c.id===r.section)).map(r=>({id:String(r.id||''),category:r.section,title:String(r.title||''),body:String(r.content||''),createdAt:r.date,authorName:String(r.author||''),attachments:Array.isArray(r.attachments)?r.attachments.filter(f=>f&&typeof f.url==='string'&&/^https:\/\/drive\.google\.com\/file\/d\/[A-Za-z0-9_-]+\/view/.test(f.url)).map(f=>({name:String(f.name||'Příloha'),url:f.url})):[]}));loadError=''}catch(err){loadError='Nepodařilo se načíst záznamy. '+err.message}adminButton.classList.add('hide');document.getElementById('roleLabel').textContent='Technik';render()}
init();
</script>
